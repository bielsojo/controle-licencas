<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Licenças Office</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --line:#e2e5ea; --text:#1b2330; --muted:#677286;
  --accent:#1f6feb; --accent-ink:#ffffff; --accent-soft:#e6efff;
  --ok:#1a8a4a; --ok-soft:#e3f5ea; --warn:#b26a00; --warn-soft:#fff1d6; --bad:#c62f3a; --bad-soft:#fde8ea;
  --res:#7a5af8; --res-soft:#efeafe; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --panel:#171e28; --panel2:#1e2733; --line:#2a3544; --text:#e8edf4; --muted:#93a0b4;
    --accent:#5b9bff; --accent-ink:#0b1220; --accent-soft:#1a2b46;
    --ok:#4cc582; --ok-soft:#14301f; --warn:#f0b24a; --warn-soft:#3a2b10; --bad:#ff7a84; --bad-soft:#3b1a1e;
    --res:#a893ff; --res-soft:#251f45; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#171e28; --panel2:#1e2733; --line:#2a3544; --text:#e8edf4; --muted:#93a0b4;
  --accent:#5b9bff; --accent-ink:#0b1220; --accent-soft:#1a2b46;
  --ok:#4cc582; --ok-soft:#14301f; --warn:#f0b24a; --warn-soft:#3a2b10; --bad:#ff7a84; --bad-soft:#3b1a1e;
  --res:#a893ff; --res-soft:#251f45; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.small{font-size:12.5px}

/* login */
.login-wrap{min-height:100%;display:grid;place-items:center;padding:24px}
.login{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.login h1{font-size:20px;margin:18px 0 4px}
.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=search],select,textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{background:var(--accent-soft);color:var(--text);border-radius:8px;padding:9px 11px;font-size:12.5px;margin-top:14px}
.err{color:var(--bad);font-size:12.5px;min-height:18px}

/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .logo{padding:4px 8px 16px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto}
.side .grow{flex:1}
.me{border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.main{padding:24px 28px 48px;min-width:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h2{margin:0;font-size:22px} .head p{margin:3px 0 0;color:var(--muted)}
.proto{background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}

/* cards */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:14px}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-weight:600;font-size:12.5px}
.kpi .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.cols2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel2)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--text)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:150px 1fr 38px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hbar .t{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar .n{text-align:right;font-weight:700}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* table */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .search{flex:1;min-width:220px;max-width:380px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;box-shadow:var(--shadow);max-height:calc(100vh - 230px)}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{position:sticky;top:0;background:var(--panel2);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);z-index:1;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--panel2)}
.count{color:var(--muted);font-size:12.5px;margin:8px 2px}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dot{width:11px;height:11px;border-radius:3px;background:var(--accent)}
.dot.f{background:transparent;border:2px solid var(--ok)} .dot.r{background:var(--res)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-res{background:var(--res-soft);color:var(--res)} .b-acc{background:var(--accent-soft);color:var(--accent)}
.b-n{background:var(--panel2);color:var(--muted)}
.empty{padding:36px;text-align:center;color:var(--muted)}

/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(10,16,26,.45);z-index:50;display:flex;justify-content:flex-end}
.ov.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(520px,100%);background:var(--bg);height:100%;overflow:auto;padding:20px;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--panel);border-radius:14px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h3{margin:0 0 4px;font-size:17px}
.row{display:flex;gap:10px;align-items:center} .row.between{justify-content:space-between} .row.wrap{flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.slot.free{border-style:dashed} .slot.res{background:var(--res-soft);border-color:transparent}
.slot .kv{display:grid;grid-template-columns:90px 1fr;gap:3px 10px;margin-top:8px;font-size:13px}
.slot .kv span:nth-child(odd){color:var(--muted)}
.cred{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:8px}
.cred .k{color:var(--muted);width:56px;font-size:12.5px}.cred .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ibtn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;display:inline-grid;place-items:center}
.ibtn:hover{background:var(--panel2);color:var(--text)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:99;box-shadow:var(--shadow)}
.plan-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
  .side .logo,.side .me,.side .grow{display:none}
  .nav{width:auto} .main{padding:16px}
  .hbar{grid-template-columns:110px 1fr 34px} .two{grid-template-columns:1fr} .plan-row{grid-template-columns:1fr}
  .tw{max-height:none}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>

/* ---------- ícones ---------- */
const P = {
  dash:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
  key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2"/><path d="m16 7 3 3"/>',
  pc:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  plus:'<circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>',
  rec:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5-5.9M9.9 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24">${P[n]||''}</svg>`;

/* ---------- dados (Supabase) ---------- */
const CONFIGURADO = /^https:\/\/.+\.supabase\.co/.test(window.SUPABASE_URL || '') && !!window.SUPABASE_KEY && !/COLE_AQUI/.test(window.SUPABASE_KEY);
const sb = CONFIGURADO ? supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true}}) : null;
const PERFIL = {admin:'Administrador', operador:'Operador', consulta:'Consulta'};
let DB = {accounts: []};
let me = null;
async function fetchAll(mk){
  let out = [], from = 0;
  for (;;){
    const {data, error} = await mk(from, from + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function loadData(){
  const contas = await fetchAll((a,b) => sb.from('contas').select('id,email').order('id').range(a,b));
  const vagas = await fetchAll((a,b) => sb.from('vagas').select('id,conta_id,n,status,hostname,serial,data_ativacao,data_incerta,proposta,obs,clientes(nome)').order('id').range(a,b));
  const by = {};
  contas.forEach(c => by[c.id] = {id:c.id, email:c.email, slots:[]});
  vagas.forEach(v => { const a = by[v.conta_id]; if (a) a.slots.push({id:v.id, n:v.n, st:v.status, cli:v.clientes ? v.clientes.nome : '', orig:'', serial:v.serial||'', host:v.hostname||'', data:v.data_ativacao, inc:v.data_incerta, prop:v.proposta||'', obs:v.obs||''}); });
  const accs = Object.values(by);
  accs.forEach(a => a.slots.sort((x,y) => x.n - y.n));
  accs.sort((a,b) => num(a.email) - num(b.email) || a.email.localeCompare(b.email));
  DB.accounts = accs;
}
function logAdd(){} function save(){}
let lastLoad = Date.now();
async function reload(quiet){
  try { await loadData(); lastLoad = Date.now(); refresh(); if (!quiet) toast('Atualizado'); }
  catch(e){ if (!quiet) toast('Erro ao atualizar: ' + e.message); }
}
async function init(){
  if (!CONFIGURADO){ renderLogin(); return; }
  try {
    const {data:{session}} = await sb.auth.getSession();
    if (!session){ renderLogin(); return; }
    await enter();
  } catch(e){ renderLogin('Não foi possível conectar: ' + e.message); }
}
async function enter(){
  $('#root').innerHTML = '<div class="login-wrap"><div class="muted">Carregando…</div></div>';
  const {data:{user}} = await sb.auth.getUser();
  const {data:p, error} = await sb.from('perfis').select('id,nome,perfil,ativo').eq('id', user.id).maybeSingle();
  if (error || !p || !p.ativo){ await sb.auth.signOut(); renderLogin('Seu usuário ainda não tem acesso. Peça ao administrador.'); return; }
  me = {id:p.id, nome:p.nome || user.email, perfil:PERFIL[p.perfil] || 'Consulta'};
  await loadData(); lastLoad = Date.now(); view = 'painel'; render();
}
window.addEventListener('focus', () => { if (me && Date.now() - lastLoad > 30000) reload(true); });

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayIso = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fmt = d => d ? d.split('-').reverse().join('/') : '—';
const ageDays = d => d ? Math.floor((Date.now() - new Date(d + 'T00:00:00')) / 864e5) : null;
const num = e => parseInt((e.match(/(\d+)@/) || [0,0])[1], 10);
const canEdit = () => me && me.perfil !== 'Consulta';
const isAdmin = () => me && me.perfil === 'Administrador';
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const cnt = a => ({
  u: a.slots.filter(s => s.st === 'ativo').length,
  f: a.slots.filter(s => s.st === 'disponivel').length,
  r: a.slots.filter(s => s.st === 'reservado').length
});
const allSlots = () => DB.accounts.flatMap(a => a.slots.map(s => ({a, s})));
const activeSlots = () => allSlots().filter(x => x.s.st === 'ativo');
function clientList(){
  const m = {};
  activeSlots().forEach(x => { m[x.s.cli] = (m[x.s.cli] || 0) + 1; });
  return Object.entries(m).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
}
function logAdd(acao, detalhe){
  DB.log.unshift({t: new Date().toISOString(), user: me ? me.nome : '—', acao, detalhe});
  if (DB.log.length > 500) DB.log.length = 500;
}
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function copy(txt){
  try { navigator.clipboard.writeText(txt).then(() => toast('Copiado!'), () => fb()); } catch(e){ fb(); }
  function fb(){ const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); toast('Copiado!');}catch(e){toast('Não foi possível copiar');} t.remove(); }
}
const dateTag = s => s.data ? `${fmt(s.data)}${s.inc ? ' <span class="badge b-warn" title="Data possivelmente com dia e mês trocados na planilha original. Confirme.">?</span>' : ''}` : '<span class="muted">sem data</span>';

/* ---------- login ---------- */
function renderLogin(msg=''){
  $('#root').innerHTML = `
  <div class="login-wrap"><form class="login" onsubmit="return doLogin(event)">
    <div class="logo"><span class="mark">${ic('key')}</span> Controle de Licenças</div>
    <h1>Entrar</h1><div class="muted">Acesso restrito à equipe.</div>
    <div class="field"><label>E-mail</label><input type="text" id="lu" autocomplete="username" autofocus></div>
    <div class="field"><label>Senha</label><input type="password" id="lp" autocomplete="current-password"></div>
    <div class="err" id="le">${esc(msg || (CONFIGURADO ? '' : 'Configuração pendente: preencha o arquivo config.js com a URL e a chave do Supabase.'))}</div>
    <button class="btn primary" style="width:100%;justify-content:center">Entrar</button>
  </form></div>`;
}
async function doLogin(e){
  e.preventDefault();
  if (!CONFIGURADO) return false;
  const em = $('#lu').value.trim(), p = $('#lp').value;
  $('#le').textContent = 'Entrando…';
  const {error} = await sb.auth.signInWithPassword({email:em, password:p});
  if (error){ $('#le').textContent = 'E-mail ou senha incorretos.'; return false; }
  try { await enter(); } catch(err){ renderLogin('Erro ao carregar: ' + err.message); }
  return false;
}
async function logout(){ try { await sb.auth.signOut(); } catch(e){} me = null; DB.accounts = []; renderLogin(); }

/* ---------- shell ---------- */
let view = 'painel';
const NAV = [
  ['painel','dash','Painel'], ['contas','key','Contas'], ['maquinas','pc','Máquinas'],
  ['alocar','plus','Nova ativação'], ['reciclar','rec','Reciclagem'], ['qualidade','shield','Qualidade dos dados'],
  ['historico','clock','Histórico'], ['usuarios','users','Usuários']
];
function qualityIssues(){
  const act = activeSlots();
  const serialMap = {};
  act.forEach(x => { if (x.s.serial) (serialMap[x.s.serial.toUpperCase()] ||= []).push(x); });
  return {
    dup: Object.entries(serialMap).filter(([k,v]) => v.length > 1),
    noHost: act.filter(x => !x.s.host),
    noSerial: act.filter(x => !x.s.serial),
    noDate: act.filter(x => !x.s.data),
    inc: act.filter(x => x.s.inc),
    noClient: act.filter(x => /N[ÃA]O ENCONTRADO|VERIFICAR/i.test(x.s.cli))
  };
}
function render(){
  if (!me){ renderLogin(); return; }
  const q = qualityIssues();

function slotForm(email, n){

function serialTaken(serial, exceptSlot){
  if (!serial) return null;
  return activeSlots().find(x => x.s !== exceptSlot && x.s.serial.toUpperCase() === serial.toUpperCase());
}
async function saveSlot(email, n){
  const a = DB.accounts.find(x => x.email === email), s = a.slots.find(x => x.n === n);
  const cli = $('#fc').value.trim().toUpperCase(), serial = $('#fs').value.trim().toUpperCase();

  const dup = serialTaken(serial, s);
  if (dup){ $('#fe').textContent = `Serial já está em uso na conta ${dup.a.email} (${dup.s.cli}).`; return; }
  const was = s.st === 'ativo';
  $('#fe').textContent = 'Salvando…';
  const {error} = await sb.rpc(was ? 'editar_vaga' : 'ativar_vaga', {p_vaga:s.id, p_cliente:cli, p_hostname:$('#fh').value.trim(), p_serial:serial, p_data:$('#fd').value || null, p_proposta:$('#fp').value.trim(), p_obs:$('#fo').value.trim()});
  if (error){ $('#fe').textContent = error.message; return; }
  await loadData(); closeModal(); toast(was ? 'Alterações salvas' : 'Máquina ativada'); refresh();
}

async function doRelease(email, n){

let AL = {cli:'', qtd:1, plan:null};
function vAlocar(){
  $('#main').innerHTML = head('Nova ativação', 'Descubra onde ativar o Office para um cliente. Se não houver vaga, a ferramenta sugere reciclar as licenças mais antigas.') + `
  <div class="card" style="max-width:640px">
    <div class="two"><div class="field"><label>Cliente *</label><input type="text" id="ac" list="cls" value="${esc(AL.cli)}" placeholder="Escolha ou digite um cliente">${clientDatalist()}</div>
    <div class="field"><label>Quantidade de máquinas</label><input type="number" id="aq" min="1" max="20" value="${AL.qtd}"></div></div>
    <div class="err" id="ae"></div>
    <button class="btn primary" onclick="makePlan()">Sugerir onde ativar</button>
  </div><div id="plan"></div>`;
  if (AL.plan) drawPlan();
}
function makePlan(){
  const cli = $('#ac').value.trim().toUpperCase(), qtd = Math.max(1, Math.min(20, parseInt($('#aq').value) || 1));
  if (!cli){ $('#ae').textContent = 'Informe o cliente.'; return; }
  AL.cli = cli; AL.qtd = qtd;
  const withFree = DB.accounts.map(a => ({a, f:a.slots.filter(s => s.st==='disponivel'), has:a.slots.some(s => s.st==='ativo' && s.cli===cli)})).filter(x => x.f.length);
  let picks = [];
  const fit = withFree.filter(x => x.f.length >= qtd).sort((x,y) => (y.has-x.has) || (x.f.length-y.f.length) || num(x.a.email)-num(y.a.email))[0];
  if (fit) picks = fit.f.slice(0, qtd).map(s => ({a:fit.a, s}));
  else {
    withFree.sort((x,y) => (y.has-x.has) || (y.f.length-x.f.length) || num(x.a.email)-num(y.a.email));
    for (const x of withFree) for (const s of x.f) if (picks.length < qtd) picks.push({a:x.a, s});
  }
  const plan = picks.map(p => ({type:'livre', email:p.a.email, n:p.s.n}));
  const need = qtd - plan.length;
  if (need > 0){
    const old = activeSlots().sort((x,y) => (x.s.data ? 0 : 1) - (y.s.data ? 0 : 1) || (x.s.data||'').localeCompare(y.s.data||'')).slice(0, need);
    old.forEach(x => plan.push({type:'reciclar', email:x.a.email, n:x.s.n}));
  }
  AL.plan = plan; drawPlan();
}
function drawPlan(){
  const rec = AL.plan.filter(p => p.type === 'reciclar').length;
  $('#plan').innerHTML = `<div class="card" style="max-width:820px;margin-top:14px"><h3>Plano para ${esc(AL.cli)} · ${AL.plan.length} máquina${AL.plan.length>1?'s':''}</h3>
  ${rec ? `<div class="warnbox">Só há ${AL.plan.length-rec} vaga(s) livre(s). <b>${rec}</b> máquina(s) abaixo serão <b>recicladas</b> (as ativações mais antigas). Confira antes de confirmar. Licenças reservadas nunca são sugeridas.</div>` : '<div class="badge b-ok" style="margin-bottom:8px">Há vagas livres suficientes, nenhuma reciclagem necessária</div>'}
  ${AL.plan.map((p,i) => {
    const a = DB.accounts.find(x => x.email === p.email), s = a.slots.find(x => x.n === p.n);
    return `<div class="plan-row"><div><div class="mono">${esc(p.email)} <span class="muted">· vaga ${p.n}</span></div>
      ${p.type==='livre' ? '<span class="badge b-ok">vaga livre</span>' : `<span class="badge b-warn">reciclar</span> <span class="small muted">${esc(s.cli)} · ${esc(s.host||'sem hostname')} · ${fmt(s.data)}${s.data?` (${ageDays(s.data)} dias)`:''}</span>`}</div>
      <input type="text" id="ph${i}" placeholder="Hostname"><input type="text" id="ps${i}" placeholder="Serial"></div>`;
  }).join('')}
  <div class="err" id="pe" style="margin-top:8px"></div>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="AL.plan=null;$('#plan').innerHTML=''">Cancelar</button>
    ${canEdit() ? `<button class="btn primary" onclick="confirmPlan()">Confirmar ativação</button>` : '<span class="muted small">Seu perfil é somente consulta</span>'}</div></div>`;
}
async function confirmPlan(){
  const seen = new Set();
  for (let i = 0; i < AL.plan.length; i++){
    const sr = $('#ps'+i).value.trim().toUpperCase(); if (!sr) continue;
    if (seen.has(sr) || serialTaken(sr, null)){ $('#pe').textContent = `Serial ${sr} já está em uso.`; return; }
    seen.add(sr);
  }
  const items = AL.plan.map((p,i) => {
    const a = DB.accounts.find(x => x.email === p.email), s = a.slots.find(x => x.n === p.n);
    return {vaga_id:s.id, reciclar:p.type === 'reciclar', cliente:AL.cli, hostname:$('#ph'+i).value.trim(), serial:$('#ps'+i).value.trim().toUpperCase(), data:todayIso()};
  });
  $('#pe').textContent = 'Salvando…';
  const {error} = await sb.rpc('ativar_lote', {p_itens: items});
  if (error){ $('#pe').textContent = error.message; return; }
  await loadData(); const n = items.length; AL.plan = null; toast(`${n} ativação(ões) registrada(s)`); vAlocar();
}

/* ---------- reciclagem ---------- */
let SEL = new Set();
function vReciclar(){
  const cl = clientList();
  $('#main').innerHTML = head('Reciclagem', 'Libere as ativações mais antigas para reaproveitar as licenças. Licenças reservadas ficam de fora.') + `
  <div class="tools">
    <input type="search" class="search" placeholder="Buscar cliente, hostname ou conta…" value="${esc(F.rq)}" oninput="F.rq=this.value;vRecBody()">
    <select style="width:auto" onchange="F.rage=this.value;vRecBody()">${[['0','Qualquer idade'],['90','Mais de 90 dias'],['180','Mais de 180 dias'],['270','Mais de 270 dias'],['365','Mais de 1 ano']].map(([v,l]) => `<option value="${v}" ${F.rage===v?'selected':''}>${l}</option>`).join('')}</select>
    <select style="width:auto;max-width:240px" onchange="F.rcli=this.value;vRecBody()"><option value="">Todos os clientes</option>${cl.map(([n,c]) => `<option value="${esc(n)}" ${F.rcli===n?'selected':''}>${esc(n)} (${c})</option>`).join('')}</select>
    <button class="btn danger" id="rbtn" onclick="confirmBulk()" ${canEdit()?'':'disabled'}>Liberar selecionadas (0)</button>
  </div><div id="rbody"></div>`;
  vRecBody();
}
const rkey = x => x.a.email + '#' + x.s.n;
function recList(){
  const q = norm(F.rq), min = parseInt(F.rage);
  return activeSlots().filter(x => x.s.data && ageDays(x.s.data) >= min && (!F.rcli || x.s.cli === F.rcli) && (!q || norm([x.s.cli,x.s.host,x.a.email].join(' ')).includes(q)))
    .sort((a,b) => a.s.data.localeCompare(b.s.data));
}
function vRecBody(){
  const L = recList();
  $('#rbody').innerHTML = `<div class="tw"><table><thead><tr><th style="width:36px"><input type="checkbox" onchange="selAll(this.checked)"></th><th>Cliente</th><th>Hostname</th><th>Conta / vaga</th><th>Ativada em</th><th>Idade</th></tr></thead><tbody>
  ${L.slice(0,300).map(x => `<tr><td><input type="checkbox" ${SEL.has(rkey(x))?'checked':''} ${canEdit()?'':'disabled'} onchange="selOne('${rkey(x)}',this.checked)"></td><td><b>${esc(x.s.cli)}</b></td><td class="mono">${esc(x.s.host)||'—'}</td><td class="mono small">${esc(x.a.email)} <span class="muted">#${x.s.n}</span></td><td>${dateTag(x.s)}</td><td><span class="badge b-n">${ageDays(x.s.data)} dias</span></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nenhuma ativação neste filtro.</td></tr>'}
  </tbody></table></div><div class="count">${L.length} ativações · ordenadas da mais antiga para a mais recente · máquinas sem data não aparecem aqui</div>`;
  updRbtn();
}
function updRbtn(){ const b = $('#rbtn'); if (b) b.textContent = `Liberar selecionadas (${SEL.size})`; }
function selOne(k, on){ on ? SEL.add(k) : SEL.delete(k); updRbtn(); }
function selAll(on){ recList().slice(0,300).forEach(x => on ? SEL.add(rkey(x)) : SEL.delete(rkey(x))); vRecBody(); }
function confirmBulk(){
  if (!SEL.size){ toast('Selecione ao menos uma máquina'); return; }
  modal(`<h3>Liberar ${SEL.size} vaga(s)?</h3><p>As vagas ficarão <b>livres</b> para reutilização e a ação será registrada no histórico. Lembre de desativar o Office nas máquinas correspondentes.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="doBulk()">Liberar ${SEL.size}</button></div>`);
}
async function doBulk(){
  const ids = []; activeSlots().forEach(x => { if (SEL.has(rkey(x))) ids.push(x.s.id); });
  const {data, error} = await sb.rpc('liberar_lote', {p_vagas: ids});
  if (error){ toast(error.message); return; }
  SEL.clear(); await loadData(); closeModal(); toast(`${data} vaga(s) liberada(s)`); vReciclar();
}

/* ---------- qualidade ---------- */
function vQualidade(){
  const q = qualityIssues();
  const list = (arr, fn, max=12) => arr.length ? `<table><tbody>${arr.slice(0,max).map(fn).join('')}</tbody></table>${arr.length>max?`<div class="count">+ ${arr.length-max} outros</div>`:''}` : '<div class="badge b-ok">Tudo certo</div>';
  const row = x => `<tr class="click" onclick="openAccount('${x.a.email}')"><td>${esc(x.s.cli)}</td><td class="mono">${esc(x.s.host||'—')}</td><td class="mono">${esc(x.s.serial||'—')}</td><td class="mono small">${esc(x.a.email)} #${x.s.n}</td></tr>`;
  const renamed = {};
  activeSlots().forEach(x => { if (x.s.orig && x.s.orig.trim().toUpperCase() !== x.s.cli) (renamed[x.s.cli] ||= new Set()).add(x.s.orig.trim()); });
  const rn = Object.entries(renamed).filter(([k,v]) => v.size).sort((a,b) => b[1].size - a[1].size);
  $('#main').innerHTML = head('Qualidade dos dados', 'Itens que merecem revisão nos dados atuais') + `
  <div class="grid cols2">
    <div class="card"><h3>Seriais duplicados <span class="badge ${q.dup.length?'b-bad':'b-ok'}">${q.dup.length}</span></h3>
      ${list(q.dup, ([k,v]) => `<tr><td class="mono">${esc(k)}</td><td class="small">${v.map(x => `<a href="#" onclick="openAccount('${x.a.email}');return false">${esc(x.s.cli)} (${esc(x.a.email.split('@')[0])})</a>`).join(' · ')}</td></tr>`)}</div>
    <div class="card"><h3>Cliente não identificado <span class="badge ${q.noClient.length?'b-warn':'b-ok'}">${q.noClient.length}</span></h3>${list(q.noClient,row)}</div>
    <div class="card"><h3>Sem hostname <span class="badge ${q.noHost.length?'b-warn':'b-ok'}">${q.noHost.length}</span></h3>${list(q.noHost,row)}</div>
    <div class="card"><h3>Sem serial <span class="badge ${q.noSerial.length?'b-warn':'b-ok'}">${q.noSerial.length}</span></h3>${list(q.noSerial,row)}</div>
    <div class="card"><h3>Datas para confirmar <span class="badge b-warn">${q.inc.length}</span></h3>
      <div class="small muted" style="margin-bottom:8px">Na planilha, parte das datas foi gravada com dia e mês trocados (ex.: 07/02 que na verdade é 02/07). Nelas o dia é 12 ou menos, então não dá para ter certeza. Corrigimos as que caíam no futuro; as demais estão marcadas com <span class="badge b-warn">?</span> para você confirmar. Isso afeta a ordem da reciclagem.</div>
      ${list(q.inc, x => `<tr class="click" onclick="openAccount('${x.a.email}')"><td>${esc(x.s.cli)}</td><td class="mono">${esc(x.s.host||'—')}</td><td>${fmt(x.s.data)}</td></tr>`, 6)}</div>
  </div>`;
}

/* ---------- histórico ---------- */
async function vHistorico(){
  $('#main').innerHTML = head('Histórico', 'Quem fez o quê e quando (últimas 300 ações)') + '<div class="empty">Carregando…</div>';
  const {data, error} = await sb.from('historico').select('quando,usuario_nome,acao,detalhe').order('quando', {ascending:false}).limit(300);
  if (view !== 'historico') return;
  const L = data || [];
  $('#main').innerHTML = head('Histórico', 'Quem fez o quê e quando (últimas 300 ações)') + `
  <div class="tw"><table><thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Detalhe</th></tr></thead><tbody>
  ${error ? `<tr><td colspan="4" class="empty">Erro: ${esc(error.message)}</td></tr>` : L.map(l => `<tr><td class="small">${new Date(l.quando).toLocaleString('pt-BR')}</td><td>${esc(l.usuario_nome)}</td><td><span class="badge b-n">${esc(l.acao)}</span></td><td class="small">${esc(l.detalhe)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nenhuma ação registrada ainda.</td></tr>'}
  </tbody></table></div>`;
}

/* ---------- usuários ---------- */
async function vUsuarios(){
  $('#main').innerHTML = head('Usuários', 'Quem pode acessar a ferramenta') + '<div class="empty">Carregando…</div>';
  const {data, error} = await sb.from('perfis').select('id,nome,perfil,ativo').order('nome');
  if (view !== 'usuarios') return;
  const L = data || [];
  $('#main').innerHTML = head('Usuários', 'Quem pode acessar a ferramenta') + `
  <div class="tw"><table><thead><tr><th>Nome</th><th>Perfil</th><th>Acesso</th></tr></thead><tbody>
  ${error ? `<tr><td colspan="3" class="empty">Erro: ${esc(error.message)}</td></tr>` : L.map(u => `<tr><td><b>${esc(u.nome)}</b> ${u.id===me.id?'<span class="badge b-acc">você</span>':''}</td>
    <td>${isAdmin() && u.id!==me.id ? `<select style="width:auto" onchange="setPerfil('${u.id}',this.value)">${['admin','operador','consulta'].map(p => `<option value="${p}" ${u.perfil===p?'selected':''}>${PERFIL[p]}</option>`).join('')}</select>` : `<span class="badge ${u.perfil==='admin'?'b-res':u.perfil==='operador'?'b-acc':'b-n'}">${PERFIL[u.perfil]}</span>`}</td>
    <td>${isAdmin() && u.id!==me.id ? `<button class="btn sm ${u.ativo?'danger':''}" onclick="setAtivo('${u.id}',${!u.ativo})">${u.ativo?'Bloquear':'Reativar'}</button>` : (u.ativo?'<span class="badge b-ok">ativo</span>':'<span class="badge b-bad">bloqueado</span>')}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="card" style="margin-top:14px;max-width:720px"><h3>Perfis</h3>
    <div class="small"><b>Administrador:</b> tudo, inclusive gerenciar usuários.<br><b>Operador:</b> consulta e altera licenças (ativar, editar, liberar).<br><b>Consulta:</b> só visualiza contas e senhas, sem alterar nada.</div>
    ${isAdmin() ? '<div class="small muted" style="margin-top:12px">Para criar um novo usuário: no Supabase, vá em <b>Authentication → Users → Add user</b>. Ele entra como Consulta; depois ajuste o perfil aqui.</div>' : ''}</div>`;
}
async function setPerfil(id, perfil){
  const {error} = await sb.from('perfis').update({perfil}).eq('id', id);
  toast(error ? 'Erro: ' + error.message : 'Perfil atualizado'); vUsuarios();
}
async function setAtivo(id, ativo){
  const {error} = await sb.from('perfis').update({ativo}).eq('id', id);
  toast(error ? 'Erro: ' + error.message : (ativo ? 'Usuário reativado' : 'Usuário bloqueado')); vUsuarios();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if ($('#mdl')) closeModal(); else closeLayer(); } });
init();
</script>
</body>
</html>
